name: Akrep Kalite Denetimi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  kalite:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: Node ortamını kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: pnpm kur
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile
      - name: Birim testleri
        run: pnpm test
      - name: Linter
        run: pnpm lint
      - name: Tip denetimi
        run: pnpm check
